[package]
name = "project_x_procgen"
description = "Project X: crate pertaining to procedural generation in the game."
version = "0.0.1"
authors = ["pierreyoda <pierreyoda@users.noreply.github.com>"]
edition = "2024"
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
# debugging renderer drawing maps as images
debug-images = ["dep:image"]

[dependencies]
# internal:
project_x_core = { path = "../core" }
# external:
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
] }
noise = "0.9"
rand = { version = "0.10.3", default-features = false }
