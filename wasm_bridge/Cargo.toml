[package]
name = "project_x_wasm_bridge"
description = "Project X: WASM bridge crate for use in the client, with full Typescript support."
version = "0.0.1"
authors = ["pierreyoda <pierreyoda@users.noreply.github.com>"]
edition = "2024"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[profile.release]
lto = true # Link-Time Optimisation: faster and smaller code but longer compilation

[dependencies]
# internal:
project_x_core = { path = "../core" }
project_x_procgen = { path = "../procgen" }
# external:
# `rand`'s OS randomness (pulled by `fake` in `procgen`) needs a backend on wasm32-unknown-unknown: the browser's
# `crypto.getRandomValues`, to only be enabled by the final crate
getrandom = { version = "0.4.3", features = ["wasm_js"] }
js-sys = "0.3.106"
# the wire format between the bridge and the client lives here, not in `core`
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "0.2.129"

# enabled in debug only due to required infrastructure (std::fmt, std::panicking)
[target."cfg(debug_assertions)".dependencies]
console_error_panic_hook = "0.1.5"
